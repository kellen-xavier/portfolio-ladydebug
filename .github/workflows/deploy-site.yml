name: Lint and Merge

on:
  pull_request:
    branches:
      - develop  

  push:
    branches:
      - develop 

jobs:
  cache-and-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Merge into develop (if lint passes)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git checkout develop 
          git merge ${{ github.ref }} --no-ff -m "Merge ${{ github.ref }} into develop"
          git push
