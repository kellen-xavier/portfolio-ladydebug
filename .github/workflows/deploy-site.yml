name: Deploy to Vercel

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2.2.4
        with:
          version: 7.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Merge develop into main
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git checkout main
          git merge develop --no-ff -m "Merge develop into main"
          git push

      - name: Create tag
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M%S')
          git tag -a $VERSION -m "Deployment $VERSION"
          git push --tags

      - name: Build project
        run: pnpm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }} # Obrigatório
          vercel-project-id: ${{ secrets.PROJECT_ID }} # Obrigatório
          # working-directory: ./sub-directory # Use apenas se seu projeto estiver em uma subpasta
